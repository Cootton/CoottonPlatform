name: Container build checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build without credentials or deployment
        run: docker build -f Dockerfile.${{ matrix.component }} -t cootton-${{ matrix.component }}:verify .
